<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="lib" content="../village/">
<meta name="fonts" content="../">
<title>ដំណើរឆ្លងកាល</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap" rel="stylesheet">
<style>
/* VOICE: playful and reverent, a Saturday-morning N64 adventure through Genesis.
   IDEA: an N64 cartridge game: Ocarina-style text boxes, the controller's A/B/Start buttons.
   PICTURE: the low-poly 3D world fills the screen, rendered at ~240 lines and blurred up.
   COLOUR and TYPE: navy text boxes #0b1030, N64 blue A #2f5fd0, green B #2a9d4a, red Start #d03a2a, yellow C #f2c51c; Moul titles, Battambang text.
   LAYOUT: full-bleed canvas; goal top-left, book top-right, stick bottom-left, A/B bottom-right, text box along the bottom. */
:root{--box:rgba(11,16,48,.86);--line:#c8d4ff;--a:#2f5fd0;--b:#2a9d4a;--st:#d03a2a;--c:#f2c51c;--ink:#fff;
--kh:"Battambang","Noto Sans Khmer","Khmer OS",sans-serif;--ti:"Moul","Battambang",serif;
--t:env(safe-area-inset-top,0px);--bt:env(safe-area-inset-bottom,0px);--l:env(safe-area-inset-left,0px);--r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font:17px/1.6 var(--kh);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas#gl{display:block;position:fixed;inset:0;width:100%;height:100%;image-rendering:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.hide{display:none!important}
.box{background:var(--box);border:2px solid rgba(200,212,255,.55);border-radius:14px;box-shadow:0 0 0 2px rgba(0,0,0,.5),0 8px 30px rgba(0,0,0,.4)}
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#obj{position:fixed;top:calc(10px + var(--t));left:calc(10px + var(--l));max-width:min(70vw,520px);padding:6px 12px 6px 34px;font-size:17px;line-height:1.7}
#obj:before{content:"";position:absolute;left:10px;top:14px;width:14px;height:14px;background:var(--c);transform:rotate(45deg);box-shadow:0 0 8px var(--c)}
#obj:empty{display:none}
#obj .w,#line .w{cursor:pointer;border-radius:6px;padding:0 2px}
#obj .w:active,.w.play{background:rgba(242,197,28,.3)}
#bookbtn{position:fixed;top:calc(10px + var(--t));right:calc(10px + var(--r));width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f07060,var(--st) 60%,#7a1a10);box-shadow:0 3px 0 #50100a,0 0 0 3px rgba(0,0,0,.4);display:grid;place-items:center;font:700 13px var(--kh)}
#bookbtn svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2}
#count{position:absolute;bottom:-4px;right:-6px;background:var(--c);color:#2a2000;border-radius:9px;font:700 12px var(--kh);padding:0 6px;line-height:18px}
#arrow{position:fixed;width:34px;height:34px;margin:-17px;pointer-events:none!important;filter:drop-shadow(0 0 6px var(--c))}
#arrow svg{width:100%;height:100%}
#joy{position:fixed;left:0;bottom:0;width:45vw;height:58vh}
#joyring{position:fixed;width:118px;height:118px;margin:-59px;border-radius:50%;border:3px solid rgba(200,212,255,.5);background:rgba(11,16,48,.35);pointer-events:none!important}
#joyknob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ddd,#888);box-shadow:0 3px 0 #444}
#joyhint{position:fixed;left:calc(30px + var(--l));bottom:calc(30px + var(--bt));width:96px;height:96px;border-radius:50%;border:3px dashed rgba(200,212,255,.35);pointer-events:none!important;display:grid;place-items:center;font-size:14px;color:rgba(255,255,255,.6)}
#btns{position:fixed;right:calc(14px + var(--r));bottom:calc(18px + var(--bt));display:grid;grid-template-columns:auto auto;align-items:end;gap:10px}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px}
.nb span{font:700 14px/1.4 var(--kh);text-shadow:0 2px 3px #000;max-width:9em;text-align:center}
.nb button{border-radius:50%;display:grid;place-items:center;font:700 26px/1 Arial,sans-serif;box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 0 3px rgba(0,0,0,.35)}
.nb button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45),0 0 0 3px rgba(0,0,0,.35)}
#bA{width:80px;height:80px;background:radial-gradient(circle at 40% 35%,#7aa0ff,var(--a) 60%,#14306e)}
#bB{width:62px;height:62px;background:radial-gradient(circle at 40% 35%,#70d890,var(--b) 60%,#0e4a20)}
#nA.off{opacity:.35;pointer-events:none}
#nA.on button{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 0 3px rgba(0,0,0,.35),0 0 22px 6px rgba(122,160,255,.8)}}
#toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);padding:8px 22px;text-align:center;pointer-events:none!important;opacity:0;transition:opacity .3s;max-width:88vw}
#toast.on{opacity:1}
#toast b{display:block;font:400 clamp(30px,8vw,46px)/1.7 var(--ti);color:var(--c);text-shadow:0 3px 0 #000}
#toast i{font-style:normal;font-size:18px}
/* text box */
#dlg{position:fixed;left:calc(8px + var(--l));right:calc(8px + var(--r));bottom:calc(8px + var(--bt));max-width:760px;margin:0 auto;padding:12px 16px 14px;cursor:pointer;z-index:10}
#who{position:absolute;top:-17px;left:16px;padding:0 12px;border-radius:8px;background:#1a2470;border:2px solid rgba(200,212,255,.6);font:700 16px/1.7 var(--kh);color:var(--c)}
#line{display:flex;flex-wrap:wrap;gap:2px 9px;align-items:baseline;min-height:62px;margin-top:6px;font-size:25px;line-height:1.8}
#line .p{color:var(--line)}
#line .w.seen{color:#fff}#line .w.new{color:#9fe0ff}
#line .w.trig{color:var(--c);animation:glow 1s ease-in-out infinite;padding:0 6px;border:2px solid var(--c)}
#line .fx{font-family:system-ui,sans-serif;color:#ffb0a0}
@keyframes glow{50%{background:rgba(242,197,28,.35);box-shadow:0 0 14px rgba(242,197,28,.8)}}
#more{position:absolute;right:16px;bottom:8px;width:0;height:0;border:9px solid transparent;border-top:12px solid var(--c);border-bottom:0;animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
#hear{position:absolute;right:44px;bottom:4px;width:44px;height:44px;display:grid;place-items:center}
#hear svg{width:24px;height:24px;stroke:var(--line);fill:none;stroke-width:2}
#pop{position:fixed;padding:6px 10px;z-index:20;pointer-events:none!important;text-align:center;transform:translate(-50%,-100%);min-width:84px}
#pop img{display:block;width:96px;height:96px;margin:0 auto;image-rendering:auto;border-radius:8px;background:rgba(255,255,255,.08)}
#pop .num{display:block;font:400 54px/1.5 var(--ti);color:var(--c)}
#pop b{display:block;font:400 22px/1.6 var(--kh);color:#fff}
/* keyboard */
#kb{position:fixed;left:calc(8px + var(--l));right:calc(8px + var(--r));bottom:calc(8px + var(--bt));max-width:760px;margin:0 auto;padding:10px;z-index:12}
#kbtop{display:flex;align-items:center;gap:8px}
#typed{flex:1;min-height:56px;border-radius:10px;background:rgba(0,0,0,.4);border:2px solid rgba(200,212,255,.35);display:flex;align-items:center;padding:0 12px;font:400 30px/1.5 var(--kh);color:var(--c);position:relative;overflow:hidden}
#ghost{position:absolute;left:12px;color:rgba(242,197,28,.25);pointer-events:none}
#typed span{position:relative}
#kbmsg{min-height:1.5em;margin:6px 2px;font-size:16px;color:var(--line)}
#keys{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.k{height:46px;border-radius:9px;background:rgba(200,212,255,.1);border:1px solid rgba(200,212,255,.25);font:400 22px var(--kh);display:grid;place-items:center}
.k:active{background:rgba(200,212,255,.35)}
.k.next{background:rgba(242,197,28,.45);border-color:var(--c);box-shadow:0 0 12px rgba(242,197,28,.7)}
.k.fn{font-size:15px;background:rgba(47,95,208,.4)}
.k.go{background:var(--b);font-size:16px;font-weight:700}
.k.go.next{background:#4cd070}
#known{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
#known button{flex:none;min-height:38px;padding:0 12px;border-radius:19px;border:1px solid rgba(200,212,255,.4);font-size:18px}
#known button.sel{background:rgba(242,197,28,.3);border-color:var(--c)}
.btn{min-height:44px;padding:4px 18px;border-radius:22px;border:2px solid rgba(200,212,255,.55);font:700 16px var(--kh)}
.btn.pri{background:var(--a);border-color:#9ab4ff}
/* book */
#book{position:fixed;left:calc(8px + var(--l));right:calc(8px + var(--r));top:calc(8px + var(--t));bottom:calc(8px + var(--bt));max-width:760px;margin:0 auto;padding:12px;display:flex;flex-direction:column;z-index:14}
#book header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#book h2{margin:0 auto 0 0;font:400 20px/1.8 var(--ti);color:var(--c)}
.tab{min-height:40px;padding:0 14px;border-radius:20px;border:2px solid rgba(200,212,255,.4);font-weight:700}
.tab.on{background:var(--c);color:#2a2000;border-color:var(--c)}
#bookbody{flex:1;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;align-content:start}
#bookbody.list{grid-template-columns:1fr}
.card{border-radius:10px;padding:6px;background:rgba(200,212,255,.07);border:1px solid rgba(200,212,255,.25);display:flex;flex-direction:column;align-items:center;gap:2px}
.card img{width:72px;height:72px;border-radius:6px}
.card .num{font:400 34px/72px var(--ti);color:var(--c);height:72px}
.card .blank{width:72px;height:72px;border-radius:6px;background:rgba(255,255,255,.05)}
.card b{font:400 19px/1.6 var(--kh)}
.card small{font-size:12px;color:var(--line)}
.chap{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:12px;background:rgba(200,212,255,.07);border:1px solid rgba(200,212,255,.25)}
.chap strong{font:400 17px/1.9 var(--ti);color:var(--c);display:block}
.chap small{color:var(--line)}
.chap.lock{opacity:.35;pointer-events:none}
.chap .n{flex:none;width:40px;height:40px;border-radius:50%;background:var(--a);display:grid;place-items:center;font:400 18px var(--ti)}
#bookfoot{display:flex;justify-content:flex-end;margin-top:8px}
/* leap, title card, screens */
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:25;background:radial-gradient(circle at 50% 55%,#fff 0,#bfe8ff 25%,#3a7cff 60%,#0a1a6a 100%)}
#card{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;z-index:26;opacity:0;transition:opacity .6s}
#card.on{opacity:1}
#card b{display:block;font:400 clamp(30px,8vw,54px)/1.6 var(--ti);color:#fff;text-shadow:0 4px 0 #0a1a6a,0 0 24px #3a7cff}
#card i{font-style:normal;font-size:19px;color:#dfe8ff;text-shadow:0 2px 0 #000}
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:30;text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(30,50,140,.55),rgba(0,0,10,.94))}
.screen h1{margin:0;font:400 clamp(34px,10vw,66px)/1.5 var(--ti);color:#fff;text-shadow:0 5px 0 #1a2a8a,0 0 30px #3a7cff;text-wrap:balance}
.screen .sub{font:400 clamp(16px,4.5vw,22px)/1.8 var(--ti);color:var(--c)}
.screen p{max-width:30em;margin:14px auto;font-size:18px}
.screen .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.screen .tip{font-size:15px;color:var(--line);margin-top:20px}
.screen .big{min-height:54px;padding:0 28px;font-size:19px}
@media(max-width:600px){#line{font-size:22px}.k{height:42px;font-size:20px}#keys{gap:4px}#bA{width:72px;height:72px}#bB{width:56px;height:56px}#obj{font-size:15px}}
@media(max-height:520px){#keys{grid-template-columns:repeat(12,minmax(0,1fr))}.k{height:36px;font-size:19px}#typed{min-height:44px;font-size:24px}#line{min-height:44px;font-size:21px}#dlg{padding:8px 14px 10px}}
@media(prefers-reduced-motion:reduce){#more,#nA.on button,#line .w.trig{animation:none}#toast,#card{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hide">
  <div id="obj" class="box"></div>
  <button id="bookbtn" aria-label="សៀវភៅ"><svg viewBox="0 0 24 24"><path d="M4 5c3-1.5 6-1.5 8 .5 2-2 5-2 8-.5v14c-3-1.5-6-1.5-8 .5-2-2-5-2-8-.5z"/><path d="M12 5.5v14"/></svg><span id="count">០</span></button>
  <div id="arrow" class="hide"><svg viewBox="0 0 24 24"><path d="M12 2l8 14h-5v6H9v-6H4z" fill="#f2c51c" stroke="#5a4200" stroke-width="1.5"/></svg></div>
  <div id="joy"></div>
  <div id="joyhint">ដើរ</div>
  <div id="joyring" class="hide"><div id="joyknob"></div></div>
  <div id="btns">
    <div class="nb" id="nB"><button id="bB" aria-label="និយាយ">B</button><span>និយាយ</span></div>
    <div class="nb off" id="nA"><button id="bA" aria-label="ធ្វើ">A</button><span id="lA">&nbsp;</span></div>
  </div>
</div>
<div id="toast" class="box"></div>
<div id="pop" class="box hide"></div>

<div id="dlg" class="box hide">
  <div id="who"></div>
  <div id="line"></div>
  <button id="hear" aria-label="ស្ដាប់"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12"/></svg></button>
  <div id="more"></div>
</div>

<div id="kb" class="box hide">
  <div id="known"></div>
  <div id="kbtop"><div id="typed"><span id="ghost"></span><span id="tx"></span></div><button class="btn" id="kbclose">បិទ</button></div>
  <div id="kbmsg"></div>
  <div id="keys"></div>
</div>

<div id="book" class="box hide">
  <header><h2>សៀវភៅ</h2><button class="tab on" data-t="words">ពាក្យ</button><button class="tab" data-t="chaps">រឿង</button><button class="btn" id="bookclose">បិទ</button></header>
  <div id="bookbody"></div>
  <div id="bookfoot"><button class="btn" id="reset">ចាប់ផ្ដើម ម្ដង ទៀត</button></div>
</div>

<div id="flash"></div>
<div id="card"><b></b><i></i></div>

<div id="title" class="screen">
  <div>
    <div class="sub">ព្រះគម្ពីរ · លោកុប្បត្តិ</div>
    <h1>ដំណើរឆ្លងកាល</h1>
    <p>អ្នក លោត ពី មនុស្ស ម្នាក់ ទៅ មនុស្ស ម្នាក់ ទៀត ។ ធ្វើ ឲ្យ រឿង ទៅ មុខ ។</p>
    <div class="row"><button class="btn pri big" id="start">ចាប់ផ្ដើម</button><button class="btn big hide" id="again">ចាប់ផ្ដើម ម្ដង ទៀត</button></div>
    <div class="tip">អូស ខាង ឆ្វេង ដើម្បី ដើរ · អូស ខាង ស្ដាំ ដើម្បី មើល · ចុច ពាក្យ ដើម្បី ស្ដាប់ · ពាក់ កាស</div>
  </div>
</div>
<div id="end" class="screen hide"><div id="endtxt"></div></div>

<script type="module" src="game.js"></script>
</body>
</html>
