   if(state==='done'){const cols=['#ff4d6d','#22b8f0','#7b2cbf'],ip=!!LV[lvl].mode;panel([['You crossed '+SC[curIdx()].n+'!',36,135,'#3ddc84'],[ip?'What you learned:':'The guardians wanted:',20,175],...(LV[lvl].comb&&LV[lvl].comb.word&&lvWords.length?[0,3].map(i=>lvWords.slice(i,i+3).map(w=>w.w+' '+w.m).join(', ')).filter(x=>x):LV[lvl].g).map((r,i)=>[r,22,212+i*38,cols[i]]),['★'.repeat(stars)+'☆'.repeat(3-stars),42,345,'#ff9f1c']],'Click to return to the map')}
  }
 }
 if(tp)drawTrace();
 if(chartOpen)drawChart();
 if(tr){const q=ease(Math.min(1,tr.t));ctx.fillStyle='rgba(20,12,50,'+(tr.ph===0?q:1-q)+')';ctx.fillRect(0,0,W,H)}
}
// ---- full-screen layout: the 960x600 playfield is centred and scaled to fit; the scenery continues (mirrored) into the spare space
const _fr=ctx.fillRect.bind(ctx);
ctx.fillRect=function(x,y,w,h){if(x===0&&y===0&&w===W&&h===H)_fr(-VX/VS,-VY/VS,VW/VS,VH/VS);else _fr(x,y,w,h)};
function fit(){if(typeof window==='undefined')return;const vw=window.innerWidth||960,vh=window.innerHeight||600;DPR=Math.min(QD,window.devicePixelRatio||1);mcKey='';cv.width=Math.round(vw*DPR);cv.height=Math.round(vh*DPR);cv.style.width=vw+'px';cv.style.height=vh+'px';VW=vw;VH=vh;VS=Math.min(vw/W,vh/H);VX=(vw-W*VS)/2;VY=(vh-H*VS)/2}
function marginBg(){if(tp)return null;if(state==='map'||state==='win')return getBake('map');if(state==='lab')return getBake('lab');return getScene(curIdx(),curTerr())}
function render(){
 const k=DPR*VS,ox=VX*DPR,oy=VY*DPR;ctx.setTransform(1,0,0,1,0,0);
 if(VX>.5||VY>.5){_fr(0,0,cv.width,cv.height);ctx.setTransform(k,0,0,k,ox,oy);
  const img=marginBg(),lx0=-VX/VS,ly0=-VY/VS,lx1=lx0+VW/VS,ly1=ly0+VH/VS,key=VW+'x'+VH+'@'+DPR;
  if(img&&img===mcImg&&key===mcKey&&mcCv){ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(mcCv,0,0);ctx.setTransform(k,0,0,k,ox,oy)}
  else if(img){const main=ctx;let tmp=null;try{tmp=document.createElement('canvas');tmp.width=cv.width;tmp.height=cv.height}catch(e){}
   if(tmp&&tmp.getContext){const g=tmp.getContext('2d');g.setTransform(k,0,0,k,ox,oy);
    for(let ty=-1;ty<=1;ty++)for(let tx=-2;tx<=2;tx++){if(!tx&&!ty)continue;const x0=tx*W,y0=ty*H;if(x0+W<lx0||x0>lx1||y0+H<ly0||y0>ly1)continue;g.save();g.translate(x0+(tx%2?W:0),y0+(ty%2?H:0));g.scale(tx%2?-1:1,ty%2?-1:1);g.drawImage(img,0,0);g.restore()}
    g.fillStyle='rgba(20,12,50,.28)';g.fillRect(lx0,ly0,lx1-lx0,ly1-ly0);mcCv=tmp;mcImg=img;mcKey=key;ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(mcCv,0,0);ctx.setTransform(k,0,0,k,ox,oy)}
   else{for(let ty=-1;ty<=1;ty++)for(let tx=-2;tx<=2;tx++){if(!tx&&!ty)continue;const x0=tx*W,y0=ty*H;if(x0+W<lx0||x0>lx1||y0+H<ly0||y0>ly1)continue;ctx.save();ctx.translate(x0+(tx%2?W:0),y0+(ty%2?H:0));ctx.scale(tx%2?-1:1,ty%2?-1:1);ctx.drawImage(img,0,0);ctx.restore()}
   ctx.fillStyle='rgba(20,12,50,.28)';_fr(lx0,ly0,lx1-lx0,ly1-ly0)}}
  else{ctx.fillStyle='#fff8e6';_fr(lx0,ly0,lx1-lx0,ly1-ly0)}}
 ctx.setTransform(k,0,0,k,ox,oy);
 renderGame();
 if(VH>VW*.9&&VY>30){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='rgba(20,12,50,.75)';ctx.beginPath();ctx.roundRect(8,8,VW-16,34,17);ctx.fill();ctx.font='700 14px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffe66d';ctx.fillText('Turn your phone sideways for a bigger game!',VW/2,26);ctx.setTransform(k,0,0,k,ox,oy)}
}
try{if(typeof window!=='undefined'&&window.addEventListener){fit();['resize','orientationchange','fullscreenchange','webkitfullscreenchange'].forEach(e=>window.addEventListener(e,()=>{fit();setTimeout(fit,250)}));
 const fb=document.getElementById('fs'),de=document.documentElement,can=!!(de.requestFullscreen||de.webkitRequestFullscreen),inFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
 fb.addEventListener('click',()=>{try{if(inFS()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(!can){setNote('This browser has no full screen button. On iPhone: tap Share, then Add to Home Screen, and open the game from there.',7);return}
  const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de);const lock=()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};
  if(p&&p.then)p.then(lock,()=>setNote('Full screen is blocked inside this page. Open the game on its own page to use it.',7));else lock()}catch(e){setNote('Full screen is not available here.',5)}});
 document.addEventListener('fullscreenchange',()=>{fb.textContent=inFS()?'✕':'⛶'});}}catch(e){}
let pbi=0;(function pre(){if(pbi<6){try{getScene(pbi,'water')}catch(e){}pbi++;setTimeout(pre,350)}})();setTimeout(()=>{try{getBake('map')}catch(e){}},900);
let last=performance.now();
let lastR=0,ema=16,qc=0;
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);
 if(n-lastR>=15){ema=ema*.93+Math.min(100,n-lastR)*.07;lastR=n;render();
  if(++qc>150&&ema>25&&QD>1){QD=Math.max(1,QD-.5);qc=0;ema=16;fit()}} // slow device: draw at a lower resolution
 requestAnimationFrame(loop)})(last);
